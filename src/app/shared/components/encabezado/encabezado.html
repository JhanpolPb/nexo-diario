<nav class="navbar navbar-expand-md" aria-label="Navegación principal">
  <div class="container">
    <a class="logo" routerLink="/" (click)="cerrarMenu()">
      <span class="logo-marca" aria-hidden="true">N</span>
      <span>Nexo<span class="logo-acento">Diario</span></span>
    </a>

    <div class="d-flex align-items-center gap-2 order-md-last">
      <a class="btn-favoritos-header" routerLink="/favoritos" (click)="cerrarMenu()"
         [attr.aria-label]="'Favoritos (' + favoritos.total() + ' guardadas)'">
        <i class="bi" [class.bi-heart-fill]="favoritos.total() > 0" [class.bi-heart]="favoritos.total() === 0"
           aria-hidden="true"></i>
        <span class="d-none d-sm-inline">Favoritos</span>
        @if (favoritos.total() > 0) {
          <span class="contador-favoritos">{{ favoritos.total() }}</span>
        }
      </a>
      <button class="navbar-toggler border-0" type="button" (click)="alternarMenu()"
              aria-controls="menuPrincipal" [attr.aria-expanded]="menuAbierto()"
              [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse justify-content-md-center" id="menuPrincipal" [class.show]="menuAbierto()">
      <ul class="navbar-nav menu-principal gap-md-1">
        @for (item of menu; track item.ruta) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.ruta" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: item.ruta === '/' }" ariaCurrentWhenActive="page"
               (click)="cerrarMenu()">{{ item.texto }}</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
