<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Todas las noticias de Nexo Diario, filtradas por categoría.">
  <title>Nexo Diario | Noticias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/estilos.css" rel="stylesheet">
</head>
<body data-pagina="noticias">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header id="encabezado" class="encabezado"></header>

  <main id="contenido" class="container pagina">
    <div class="mb-5">
      <p class="antetitulo">Publicaciones</p>
      <h1 class="titulo-pagina">Todas las noticias</h1>
      <p class="subtitulo">Explora nuestras últimas publicaciones</p>
    </div>

    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría"></div>

    <p class="visually-hidden" id="resultado-filtro" aria-live="polite"></p>
    <div class="row g-4" id="listado"></div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="assets/js/storage.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/componentes.js" defer></script>
  <script src="assets/js/noticias.js" defer></script>
</body>
</html>
